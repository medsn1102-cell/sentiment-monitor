name: 舆情监控定时任务

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sentiment-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sentiment-monitor
      cancel-in-progress: false

    steps:
      - name: 执行舆情监控
        run: |
          set -e
          echo "开始执行舆情监控任务: $(date)"
          echo "目标: https://fa34b440-4b64-4c40-9168-18e422c7f61b.dev.coze.site/stream_run"

          RESP=$(curl -s -w "\n%{http_code}" \
            -X POST "https://fa34b440-4b64-4c40-9168-18e422c7f61b.dev.coze.site/stream_run" \
            -H "Content-Type: application/json" \
            -d @- \
            --max-time 1800 << 'ENDJSON'
          {
            "type": "query",
            "session_id": "scheduled",
            "content": {
              "query": {
                "prompt": [
                  {
                    "type": "text",
                    "content": {
                      "text": "请搜索小牛看房和常居地产的最新舆情，生成详细的舆情报告，包括正面、中性、负面舆情统计，如有负面舆情请发送到飞书"
                    }
                  }
                ]
              }
            }
          }
          ENDJSON
          )

          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "请求失败"
            exit 1
          fi

          echo "任务执行完成: $(date)"
