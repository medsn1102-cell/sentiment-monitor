name: 舆情监控定时任务

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sentiment-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sentiment-monitor
      cancel-in-progress: false

    steps:
      - name: 执行舆情监控（含抖音/小红书）
        env:
          API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        run: |
          set -e
          echo "开始执行舆情监控任务: $(date)"
          echo "目标: https://bbtbmsf228.coze.site/stream_run"

          JSON='{
            "type": "query",
            "session_id": "scheduled",
            "project_id": 7622830068435419186,
            "content": {
              "query": {
                "prompt": [
                  {
                    "type": "text",
                    "content": {
                      "text": "请搜索小牛看房和常居地产的最新舆情，包括抖音和小红书平台，生成详细的舆情报告，如有负面舆情请发送到企业微信"
                    }
                  }
                ]
              }
            }
          }'

          RESP=$(curl -s -w "\n%{http_code}" \
            -X POST "https://bbtbmsf228.coze.site/stream_run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -d "$JSON" \
            --max-time 1800
          )

          HTTP_CODE=$(echo "$RESP" | tail -n1)

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "请求失败"
            exit 1
          fi

          echo "任务执行完成: $(date)"
